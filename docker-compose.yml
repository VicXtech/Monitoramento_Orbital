services:
  db:
    image: postgres:15-alpine
    container_name: orbital_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbital_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbital_password}
      POSTGRES_DB: ${POSTGRES_DB:-orbital_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbital_user} -d ${POSTGRES_DB:-orbital_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orbital_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orbital_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-orbital_user}:${POSTGRES_PASSWORD:-orbital_password}@db:5432/${POSTGRES_DB:-orbital_db}
      - ENV=${ENV:-development}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    networks:
      - orbital_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orbital_frontend
    restart: always
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Evita sobreposição do node_modules local do container
    depends_on:
      - backend
    networks:
      - orbital_network

volumes:
  postgres_data:

networks:
  orbital_network:
    driver: bridge
